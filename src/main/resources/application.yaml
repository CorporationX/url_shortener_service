spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379

url:
  base:
    domain: corporationx.com
    scheme: https
  cache:
    entry-ttl-hours: 1h
    key:
      prefix: "url:"
  cleanup:
    ttl: PT8760H # 365 days
    cron: "0 */10 * * * *" # once per 10 minutes

hash:
  size: 6
  repository:
    fetch-batch-size: 500
  cache:
    size: 1000
    refill-threshold-percent: 20
    executor:
      pool-size: 1
  generator:
    batch-size: 1000
    executor:
      core-pool-size: 1
      max-pool-size: 1
      queue-capacity: 0

base62:
  alphabet: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
  size: 62

server:
  port: 8080

logging:
  level:
    root: info