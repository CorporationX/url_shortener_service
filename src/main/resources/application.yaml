spring:
  shortener:
    domain: http://localhost:8080
    length: 7
    ttl: 604800
    max-attempts: 5
    prefix: "urls:"

  data:
    redis:
      port: 6379
      host: localhost

    mongodb:
      host: localhost
      port: 27017
      database: mongo
      username: user
      password: password

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    group-id: url_shortener_service

server:
  port: 8080

logging:
  level:
    root: info