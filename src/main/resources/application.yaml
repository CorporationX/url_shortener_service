spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  redis:
    host: localhost
    port: 6379

server:
  port: 8080

logging:
  level:
    root: info

hash:
  insert-batch-size: 100
  delete-batch-size: 10
  cache:
    key: urlshortener:hash_cache
    ttl: 7

url:
  delete:
    cron: "30 39 21 * * ?"
  cache:
    key: url_cache
  prefix: http://127.0.0.1:8080

base62:
  chars: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

numbers:
  count: 1000

executor:
  pool:
    size: 10
  queue:
    size: 100
  prefix: "url-shortener-"

cache:
  size: 1000
  refillPercent: 0.2
  attemptsCount: 3

