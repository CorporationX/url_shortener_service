spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          order_inserts: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

shortener:
  url:
    domain: "http://localhost:8080"
  cleaner:
    cron: "0 0 3 * * *"
    retention: 365d
  cache:
    prefix: "urls:"
    ttl: 7d
  hash:
    cache:
      capacity: 5000
      min-limit-percent: 20
      executor:
        core-pool-size: 2
        max-pool-size: 2
        queue-capacity: 500
    generator:
      batch-size: 1000
      executor:
        core-pool-size: 4
        max-pool-size: 4
        queue-capacity: 1000
