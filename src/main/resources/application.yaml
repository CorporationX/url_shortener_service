spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  data:
    redis:
      port: 6379
      host: localhost

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

urlshortener:
  base-url: "https://sh.com/"

hash:
  range: 100
  cron: 0 0 0 * * *
  cache:
    capacity: 10000
    fill:
      ratio: 0.2f

cleanup:
  cron: 0 0 0 * * *