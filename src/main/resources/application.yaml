spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    root: info

scheduler:
  clean-unused:
     cron: "0 0 0 * * ?"
     lock-name: "cleaningUnusedTask"
     lock-at-least-for: "5m"
     lock-at-most-for: "10m"
     period: 1y

shedlock:
   enabled: true
   defaults:
   lock-at-most-for: "10m"
   provider:
    jdbc:
    table-name: "shedlock"
    use-db-time: true
