spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    # clear-checksums: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 9081

logging:
  level:
    root: info

hash:
  generator:
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 50
  cache:
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 100
    capacity: 500
    fill-percent: 20
    batch-size: 1000

scheduler:
  cleaner:
    old-urls-hashes:
      cron: "0 0 0 * * ?"

app:
  redis:
    url-cache-ttl-hours: 24
  base-url: "http://127.0.0.1/"