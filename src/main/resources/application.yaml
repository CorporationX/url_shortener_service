spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        jdbc:
           batch_size: 100

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    group-id: url_shortener_service

server:
  port: 8080

logging:
  level:
    root: info

hash:
  executor:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 50
  generator:
    range: 10000
  cache:
    capacity: 10000
    min-limit-percent: 20
    executor:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 50
  cleaner:
    cron: "0 0 0 * * *"
    after-days: 1

  url:
    domain: http://localhost:8080
    cache:
      ttl: 86400