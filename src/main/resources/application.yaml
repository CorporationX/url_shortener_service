spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      db.owner: ${DB_USERNAME:user}
      db.schema: ${DB_SCHEMA:public}

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

url-shortener-service:
  cleaner:
    cron: "0 0 3 * * ?"
    expired-period-seconds: 31536000
  hash-cache:
    hashes-queue:
      size: 100
      fill-threshold-percent: 20
    thread-pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100
  hash-generator:
    hashes-batch-size: 200
    thread-pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100

logging:
  level:
    root: info
