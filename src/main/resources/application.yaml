spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false

server:
  port: 8080

logging:
  level:
    root: info

hash:
  hash-generator:
    generate-batch: 100000
  hash-cache:
    get-batch: 50000
    limit: 100000
    bound: 20000

thread-pool:
  amount:
    hash-generator: 2

hash-cleaner:
  cron: 0 0 1 * * *
  retention-period:
    years: 1