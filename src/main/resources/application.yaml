spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host:
      port: 6379

server:
  port: 8080

logging:
  level:
    root: info

async:
  thread-pool:
    core-pool-size: 1
    max-pool-size: 1
    queue-capacity: 1
    alive-seconds: 30

hash:
  cache:
    capacity: 10000
    refill-threshold-percent: 20
  range: 10000
  cron: "0 0 0 * * *"

url:
  base: "http://your-domain/"


